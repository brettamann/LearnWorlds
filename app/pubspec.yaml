name: critmath
description: CritMath — Phase 1 Flutter app. K–2 math educational game targeting iPad.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — see specs/shared/project-bootstrap.md
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Immutable models + JSON ser/de
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Boot-time schema validation (debug only)
  json_schema: ^5.1.1

  # Audio (plays pre-rendered narration files when they exist)
  just_audio: ^0.9.39

  # System TTS — fallback for un-rendered narration cues (text-and-tts-deferral.md).
  # During the deferral period, this is the only audio path (caption + system TTS).
  # Once ElevenLabs renders happen, this becomes the safety net for cueIds without files.
  flutter_tts: ^4.0.2

  # Storage
  path_provider: ^2.1.3
  path: ^1.9.0
  # Cross-platform key-value store for SaveCoordinator. Web uses localStorage,
  # mobile uses platform-native prefs. Sprint 1 vertical slice persistence.
  shared_preferences: ^2.3.0

  # Handwriting classifier
  tflite_flutter: ^0.10.4

  # Share sheet
  share_plus: ^9.0.0

  # Animation
  rive: ^0.13.4
  lottie: ^3.1.2

  # Utilities
  logger: ^2.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code-gen
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Test mocks
  mocktail: ^1.0.4

  # Virtual clock for timer-driven engines (HintLadder). Transitively present
  # via flutter_test; declared explicitly so the import is legal.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  # Bundled data (read at boot). Mirrored from repo-root data/ + content/
  # via scripts/sync-assets.sh (re-run after editing those source trees).
  # `..` paths break Flutter web's URL normalization at runtime, so we mirror
  # the trees under assets/ and reference them locally.
  #
  # Declared means opened. The mirror carries every source tree; this list is
  # the subset the app actually reads, and `asset_bundle_test.dart` keeps the
  # two facts in step in both directions - a directory declared and never
  # opened, and (the one that crashes) a path built in `asset_paths.dart` that
  # no entry covers. Five directories were shipping unread when that check was
  # written: reward-catalog, telemetry-catalog, standards-reference,
  # slot-vocabulary and content/strings. They are all still in the repo; they
  # are source and reference material, not runtime content, and re-declaring
  # one is a one-line change on the day something loads it.
  assets:
    - assets/data/concept-registry/
    - assets/data/activity-registry/
    - assets/data/lesson-runtime/
    # Placeholder art (will be replaced with official assets per
    # specs/shared/art-direction.md; structure per specs/shared/asset-paths.md).
    - assets/activities/counting-parade/sprites/
    - assets/activities/counting-parade/backgrounds/
    - assets/activities/ten-frame-pond/sprites/
    - assets/activities/shape-garden/
    # Where's Buddy landmarks. The clearing names six places and drew
    # none of them; three of the six reuse sanctuary/decor sprites and
    # these are the three that had nothing.
    - assets/activities/wheres-buddy/
    - assets/activities/picnic-baskets/sprites/
    - assets/activities/picnic-baskets/backgrounds/
    - assets/activities/caretakers-bench/backgrounds/
    - assets/activities/storytellers-pond/sprites/
    - assets/activities/storytellers-pond/backgrounds/
    - assets/activities/scribes-tower/backgrounds/
    - assets/activities/caretakers-bench/sprites/
    - assets/activities/care-pantry/sprites/
    - assets/activities/care-pantry/backgrounds/
    - assets/activities/ten-frame-pond/backgrounds/
    - assets/shared/region-characters/sanctuary/
    - assets/shared/ui/
    - assets/maps/
    - assets/rewards/k-mystery-egg/
    # Sanctuary decor — the objects she buys and places on the map.
    - assets/sanctuary/decor/
    - assets/rewards/general/
    # Buddy parts — composed at render time by BuddyWidget. Each folder
    # holds one category of swatches the character creator picks from.
    - assets/buddy/body/
    - assets/buddy/eyes/
    - assets/buddy/mouths/
    - assets/buddy/arms/
    - assets/buddy/legs/
    - assets/buddy/hats/
    # Audio. Placeholder clips generated by tools/audio/generate_placeholder_sfx.py
    # — regenerate with `python tools/audio/generate_placeholder_sfx.py` from the
    # repo root. Unlike assets/data and assets/content these are NOT mirrored
    # from a repo-root tree, so scripts/sync-assets.ps1 does not touch them.
    # NOTE: Flutter fails the build on a declared-but-missing asset directory,
    # so never add a folder here before the files exist.
    - assets/audio/sfx/ui/
    - assets/audio/sfx/feedback/
    - assets/audio/sfx/reward/
    - assets/audio/sfx/buddy/
    - assets/audio/sfx/counting/
    - assets/audio/sfx/sprite/
    - assets/audio/sfx/
    - assets/audio/music/
    # Recorded narration, one clip per cueId. Ships empty (just a .gitkeep) —
    # NarrationPlayer falls back to system TTS for every cue with no clip, so
    # the owner can record incrementally without blocking a build.
    - assets/audio/narration/
    # Remaining art assets will be added as Phase 0 style lock completes:
    # - ../assets/

  # Fonts
  fonts: []
