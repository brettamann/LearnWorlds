name: Data validation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: data-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/scripts/package-lock.json

      - name: Install pinned validator dependencies
        run: npm ci --no-audit --no-fund
        working-directory: tools/scripts

      - name: Validate all data files against their schemas
        # Walks app/assets/data/**/*.json and app/assets/content/**/*.json and
        # validates each against its declared $schema.
        run: node tools/scripts/validate-data.mjs --quiet
